services:
  bus:
    image: algosec-jira-bus:0.3.7
    platform: linux/amd64
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./config:/etc/algosec-jira-bus:ro
      - ./state:/var/lib/algosec-jira-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

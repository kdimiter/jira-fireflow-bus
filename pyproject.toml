[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algosec-jira-bus"
version = "0.3.5"
description = "Poll Jira Cloud for network access requests and mirror FireFlow progress back"
requires-python = ">=3.11"
# The bus is self-contained and uses only Python's standard library at runtime.
dependencies = []

[project.scripts]
algosec-jira-bus = "algosec_jira_bus.bus:main"

[tool.setuptools.packages.find]
include = ["algosec_jira_bus*"]

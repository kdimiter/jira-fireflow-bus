[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algosec-jira-bus"
version = "0.2.0"
description = "Poll Jira Cloud for network access requests and mirror FireFlow progress back"
requires-python = ">=3.11"
# The hardened transport/FireFlow connector is distributed through an authorized channel
# and installed separately. Keeping it out of project metadata prevents public package
# tools from attempting to resolve a non-public distribution.
dependencies = []

[project.scripts]
algosec-jira-bus = "algosec_jira_bus.bus:main"

[tool.setuptools.packages.find]
include = ["algosec_jira_bus*"]
